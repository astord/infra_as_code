global:
  checkNewVersion: false
  sendAnonymousUsage: false
log:
  level: DEBUG
api:
  dashboard: true
  insecure: true
entryPoints:
  web:
    address: :80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: :443
#Set traefik to trust backend TLS certs withouth to verify them:
#serversTransport:
#  insecureSkipVerify: true
providers:
  docker:
    #endpoint: "unix:///var/run/docker.sock" # Uncoment this if no docker socker proxy
    endpoint: "tcp://socket-proxy:2375"
    watch: true
    exposedByDefault: false
    network: docker_ipvlan #default docker network to use for connections to all containers
certificatesResolvers:
  cloudflare-dp:
    acme:
      email: "astord@mail.bg"
      storage: "/var/traefik/certs/acme.json" #/var/traefik/certs - the place where traefik will store the issued certs
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"
