services:
  cloudflared:
    container_name: cloudflared
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: proxy-dns

    # See the list of environment variables at https://github.com/cloudflare/cloudflared/blob/master/cmd/cloudflared/proxydns/cmd.go
    environment:
      TUNNEL_DNS_UPSTREAM: "https://8.8.8.8/dns-query"
      TUNNEL_DNS_PORT: 5053
      # Listen on all interfaces
      TUNNEL_DNS_ADDRESS: "0.0.0.0"
    networks:
      docker_ipvlan:
        ipv4_address: 10.1.0.12
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    depends_on:
      - cloudflared #boot after cloudflared
    environment:
      TZ: 'Europe/Sofia'
      FTLCONF_webserver_api_password: ${WEBPASSWORD}
      #Conditional forwarding of '.ast' domain queries towards the router
      #FTLCONF_dns_revServers: 'true,10.1.0.0/24,10.1.0.1#53,ast'
      FTLCONF_dns_listeningMode: 'all' # to suppress ignoring query from non-local network 10.6.0.5
      FTLCONF_dns_upstreams: '10.1.0.12#5053' #cloudflared DoH
      #FTLCONF_WHITELIST: "s.youtube.com"
      FTLCONF_dns_rateLimit_count: 0
      FTLCONF_dns_rateLimit_interval: 0  
      FTLCONF_DNS_HOSTS: 10.1.0.3 xerox.ast;10.1.0.7 debhol-cadvisor.ast;10.1.0.8 debhol-metrics.ast;10.1.0.10 debhol.ast;10.1.0.11 pihole.ast;10.1.0.20 ol-storage.ast;10.1.0.24 grafana.ast;10.1.0.25 prom-2y.ast;10.1.0.26 prom-1m.ast;10.1.0.27 alertmanager.ast;10.1.0.28 smokeping.ast;10.1.0.29 plex.ast;10.1.0.50 x1.ast;10.1.0.51 t590.ast;10.1.0.52 galaxy-a51.ast;10.1.0.53 huawei-p40.ast;10.1.0.55 laptop-ol.ast;10.1.0.56 ana-lenovo.ast;10.1.0.57 galaxy-s24.ast;10.1.0.58 galaxy-a40.ast;10.1.0.1 merlin.ast
    restart: unless-stopped
    networks:
      docker_ipvlan:
        ipv4_address: 10.1.0.11
networks:
  docker_ipvlan:
    driver: ipvlan
    name: docker_ipvlan
    external: true
