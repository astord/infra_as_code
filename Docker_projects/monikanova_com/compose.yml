services:
  monikanova-db:
    # We use a mariadb image which supports both amd64 & arm64 architecture
    image: mariadb:11.8-ubi   #previous: mariadb:11.4-ubi, mariadb:10.11-ubi, mariadb:10.6.23-jammy, mariadb:10.6.4-focal
    # If you really want to use MySQL, uncomment the following line
    #image: mysql:8.0.27
    command: '--default-authentication-plugin=mysql_native_password'
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=somewordpress
      - MYSQL_DATABASE=wordpress
      - MYSQL_USER=wordpress
      - MYSQL_PASSWORD=$DB_PASS
    expose:
      - 3306
      - 33060
    networks:
      docker_ipvlan:
        ipv4_address: 10.1.0.15
  monikanova-wp:
    image: wordpress:latest
    volumes:
      - wp_data:/var/www/html
    restart: always
    labels:
      - traefik.enable=true
      #- traefik.http.routers.monikanova.rule=Host(`monikanova.com`)
      - traefik.http.routers.monikanova.rule=Host(`monikanova.com`) || Host(`admin.monikanova.com`)
      - traefik.http.routers.monikanova.tls.certresolver=cloudflare-dp
      - traefik.http.routers.monikanova.entrypoints=websecure
      - traefik.http.routers.monikanova.tls=true
      - traefik.http.routers.monikanova.service=wp-service
      - traefik.http.services.wp-service.loadbalancer.server.port=80
    environment:
      WORDPRESS_DB_HOST: 10.1.0.15
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: $DB_PASS
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_CACHE', true);
        define('WP_MEMORY_LIMIT', '256M');
    dns: # not 10.1.0.11 because not to depend ot this internal DNS
      - 8.8.8.8
      - 1.1.1.1
    networks:
      docker_ipvlan:
        ipv4_address: 10.1.0.16
volumes:
  db_data:
  wp_data:
networks:
  web-network:
    driver: bridge
    external: true
  docker_ipvlan:
    driver: ipvlan
    name: docker_ipvlan
    external: true
