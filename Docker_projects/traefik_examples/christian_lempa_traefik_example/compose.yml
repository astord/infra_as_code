---
services:
  traefik-chris:
    image: traefik:v3.3
    container_name: traefik-demo-1
    #labels:
    #  - "traefik.http.routers.dashboard.rule=Host(`traefik.prodanov.org`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))"
    #  - "traefik.http.routers.dashboard.service=api@internal"
    ports:
      - "8080:8080"
      - "443:443"
      - "8081:8081" #This port 8081 is just to replace port 80 which was busy by apache2 service.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./cf_certs:/var/traefik/certs:rw #the place where the traefik will store the issued certs
    restart: unless-stopped
    environment:
      CF_DNS_API_TOKEN: "$CF_DNS_API_TOKEN"
    networks:
      - frontend
networks:
  frontend:
    external: true
