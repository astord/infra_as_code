accesslog: true
api:
  dashboard: true
  insecure: true

log:
  level: "DEBUG"

entryPoints:
  http:
    address: ":80"
  https:
    address: ":443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
  file:
    filename: /etc/traefik/config-services.yml

