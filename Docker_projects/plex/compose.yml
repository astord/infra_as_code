---
services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - VERSION=docker
    volumes:
      - /data/ol_storage/HDD400/Downloads:/movies
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped
    networks:
      docker_ipvlan:
        ipv4_address: 10.1.0.29
networks:
  docker_ipvlan:
    driver: ipvlan
    name: docker_ipvlan
    external: true
