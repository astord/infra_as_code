services:
  db:
    # We use a mariadb image which supports both amd64 & arm64 architecture
    image: mariadb:10.6.4-focal
    # If you really want to use MySQL, uncomment the following line
    #image: mysql:8.0.27
    command: '--default-authentication-plugin=mysql_native_password'
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=somewordpress
      - MYSQL_DATABASE=wordpress
      - MYSQL_USER=wordpress
      - MYSQL_PASSWORD=$DB_PASS
    expose:
      - 3306
      - 33060
    networks:
      docker_ipvlan:
        ipv4_address: 10.1.0.101
  wordpress:
    image: wordpress:latest
    volumes:
      - wp_data:/var/www/html
    restart: always
    labels:
      - traefik.enable=true
      - traefik.http.routers.test-wp.rule=Host(`monika.prodanov.org`)
      - traefik.http.routers.test-wp.tls.certresolver=cloudflare-dp
      - traefik.http.routers.test-wp.entrypoints=websecure
      - traefik.http.routers.test-wp.tls=true
      - traefik.http.routers.test-wp.service=wp-service
      - traefik.http.services.wp-service.loadbalancer.server.port=80
    environment:
      - WORDPRESS_DB_HOST=10.1.0.101
      - WORDPRESS_DB_USER=wordpress
      - WORDPRESS_DB_PASSWORD=$DB_PASS
      - WORDPRESS_DB_NAME=wordpress
    networks:
      docker_ipvlan:
        ipv4_address: 10.1.0.102
volumes:
  db_data:
  wp_data:
networks:
  web-network:
    driver: bridge
    external: true
  docker_ipvlan:
    driver: ipvlan
    name: docker_ipvlan
    external: true
