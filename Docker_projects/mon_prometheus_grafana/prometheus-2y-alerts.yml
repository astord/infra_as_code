groups:
- name: prom_2y_target_alerts
  rules:
  # Alert for any instance that is unreachable for >5 minutes.
  - alert: service_down
    expr: up == 0
    for: 5m
    labels:
      severity: page
    annotations:
      summary: "Instance {{ $labels.instance }} down"
      description: "{{ $labels.instance }} of job {{ $labels.job }} has been down for more than 5 minutes."
- name: sensor_alerts
  rules:
  # Alert for missing sensors data
  - alert: rpi_sensors_missing
    expr: absent(rpi_co2) == 1 or absent(rpi_temperature) == 1 or absent(rpi_humidity) == 1
    for: 10m
    labels:
      severity: page
    annotations:
      summary: "The data of one of the sensors {{ $labels.instance }} is missing"
      description: "{{ $labels.instance }} of job {{ $labels.job }} has missing some sensors data"
  # Alert for CO2 emissions over 2K
  - alert: rpi_co2_high
    expr: rpi_co2 > 2000
    for: 2m
    labels:
      severity: page
    annotations:
      summary: "The level of sensor {{ $labels.instance }} CO2 is high"
      description: "{{ $labels.instance }} of job {{ $labels.job }} has CO2 high for mor than 2 minutes"
