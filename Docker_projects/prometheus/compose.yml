#https://github.com/stefanprodan/dockprom/blob/master/docker-compose.yml
#https://github.com/prometheus/prometheus/blob/main/Dockerfile
name: "metrics" #Compose project name.
services:
  prom:        #container name
    image: prom/prometheus
    #build: .
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - time_db:/prometheus
    ports:
      - 9090:9090
    dns: 10.1.0.11
    dns_search: ast
    networks:
      docker_ipvlan:
        ipv4_address: 10.1.0.24
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=1d'
  #alertmanager:
  #nodeexporter:
  #cadvisor:
  #grafana:
  #pushgateway:
  #caddy:
networks:
  docker_ipvlan:
    driver: ipvlan
    name: docker_ipvlan
    external: true
volumes:
  time_db:
    external: true
