name: "nfs" #Compose project name.
services:
  docker:        #container name
    image: nfs:latest
    build: .
    restart: always
    privileged: true
    volumes:
      - /data/ol_storage/HDD400:/ol
      - /srv:/shared2
      - /infra/git/infra_as_code/Docker_projects/nfs/exports.file:/etc/exports:ro
      - /lib/modules:/lib/modules:ro
    networks:
      docker_ipvlan:
        ipv4_address: 10.1.0.23
networks:
  docker_ipvlan:
    driver: ipvlan
    name: docker_ipvlan
    external: true
